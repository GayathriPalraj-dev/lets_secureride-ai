# SecureRide API reverse proxy reference. The production CloudFormation stack
# renders an equivalent configuration with a private X-Origin-Verify value.
# Bind Nginx to the private/origin-facing interface through the EC2 security group.
limit_req_zone $binary_remote_addr zone=secureride_api:10m rate=20r/s;

server {
    listen 8080 default_server;
    server_name _;

    # The EC2 security group must restrict port 8080 to the AWS-managed
    # CloudFront origin-facing prefix list. The production stack also validates
    # its private origin header before requests reach these locations.

    client_max_body_size 9m;

    location /api/ {
        limit_req zone=secureride_api burst=40 nodelay;
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    location = /origin-health {
        access_log off;
        proxy_pass http://127.0.0.1:5000/api/v1/health;
    }

    location / { return 404; }
}
